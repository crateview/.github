name: Bug report
description: Report a reproducible problem in this repository.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Search existing issues before submitting. English and German reports are welcome. Remove
        passwords, tokens, cookies, private registry names and sensitive image contents from logs
        and screenshots. Report vulnerabilities privately using the security link in the issue
        chooser.
  - type: input
    id: scope
    attributes:
      label: Affected component and version
      description: Name the affected file, page or component and relevant release or commit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps and any relevant environment details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs, screenshots or a minimal reproduction.
    validations:
      required: false
